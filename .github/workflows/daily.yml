name: Daily Nodes

on:
  # Scheduled runs are disabled; enable only when explicitly requested.
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅检查运行环境，不注册账号或连接邮箱 / Resin'
        type: boolean
        default: true
      check_services:
        description: '另外检查 Gmail 邮箱及 Resin 连接，不注册 ProxyScrape 账号'
        type: boolean
        default: false
      check_backup:
        description: '另外验证加密账号备份读写，不登录或注册账号'
        type: boolean
        default: false
      count:
        description: '本次手动尝试的账号数量'
        type: string
        default: '3'
      recover_accounts:
        description: '只重登并恢复已保存账号，不注册新账号（须关闭 check_only）'
        type: boolean
        default: false
      recover_email:
        description: '仅恢复这个已保存账号；留空则恢复全部'
        type: string
        default: ''

permissions:
  contents: read

# Resin 的订阅内容更新不是原子追加，同一时间只运行一个每日任务。
concurrency:
  group: nodes-daily
  cancel-in-progress: false

jobs:
  daily:
    permissions:
      contents: write # Only encrypted account data is committed to account-vault.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODES_COUNT: ${{ inputs.count }}
      MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER || 'instant_mail' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check required configuration
        if: ${{ !inputs.check_only || inputs.check_services }}
        env:
          CLOUD_MAIL_URL: ${{ secrets.CLOUD_MAIL_URL }}
          CLOUD_MAIL_EMAIL: ${{ secrets.CLOUD_MAIL_EMAIL }}
          CLOUD_MAIL_PASSWORD: ${{ secrets.CLOUD_MAIL_PASSWORD }}
          RESIN_URL: ${{ secrets.RESIN_URL }}
          RESIN_ADMIN_TOKEN: ${{ secrets.RESIN_ADMIN_TOKEN }}
          NODES_ACCOUNT_BACKUP_KEY: ${{ secrets.NODES_ACCOUNT_BACKUP_KEY }}
          CHECK_ONLY: ${{ inputs.check_only }}
          RECOVER_ACCOUNTS: ${{ inputs.recover_accounts }}
        run: |
          missing=0
          required=(RESIN_URL RESIN_ADMIN_TOKEN)
          if [ "$CHECK_ONLY" != true ]; then
            required+=(NODES_ACCOUNT_BACKUP_KEY)
          fi
          case "$MAIL_PROVIDER" in
            instant_mail) ;;
            cloud_mail)
              if [ "$RECOVER_ACCOUNTS" != true ]; then
                required+=(CLOUD_MAIL_URL CLOUD_MAIL_EMAIL CLOUD_MAIL_PASSWORD)
              fi ;;
            *) echo '::error::MAIL_PROVIDER must be instant_mail or cloud_mail'; exit 1 ;;
          esac
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 GitHub Secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Chrome for Testing
        id: browser
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install native runtime
        env:
          CHROME_PATH: ${{ steps.browser.outputs.chrome-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          "$CHROME_PATH" --version
          echo "BROWSER_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          python -m pip install .
      - name: Check native browser without external services
        if: github.event_name == 'workflow_dispatch' && inputs.check_only
        run: |
          nodes --help
          xvfb-run -a -s '-screen 0 1280x900x24' python tests/smoke/browser.py
          xvfb-run -a -s '-screen 0 1280x900x24' python tests/smoke/turnstile_dom.py
      - name: Check mailbox and Resin connectivity
        if: github.event_name == 'workflow_dispatch' && inputs.check_services
        env:
          CLOUD_MAIL_URL: ${{ secrets.CLOUD_MAIL_URL }}
          CLOUD_MAIL_EMAIL: ${{ secrets.CLOUD_MAIL_EMAIL }}
          CLOUD_MAIL_PASSWORD: ${{ secrets.CLOUD_MAIL_PASSWORD }}
          RESIN_URL: ${{ secrets.RESIN_URL }}
          RESIN_ADMIN_TOKEN: ${{ secrets.RESIN_ADMIN_TOKEN }}
        run: python scripts/check-services.py
      - name: Check encrypted account backup without account activity
        if: ${{ inputs.check_only && inputs.check_backup }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODES_ACCOUNT_BACKUP_KEY: ${{ secrets.NODES_ACCOUNT_BACKUP_KEY }}
        run: |
          python -m nodes.github_vault restore
          python -m nodes.github_vault save
          verify_dir=$(mktemp -d)
          python -m nodes.github_vault restore --root "$verify_dir"
      - name: Restore encrypted account vault
        id: restore
        if: ${{ !inputs.check_only }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODES_ACCOUNT_BACKUP_KEY: ${{ secrets.NODES_ACCOUNT_BACKUP_KEY }}
        run: python -m nodes.github_vault restore
      - name: Register or recover, export and synchronize to Resin
        id: task
        if: ${{ !inputs.check_only }}
        env:
          CLOUD_MAIL_URL: ${{ secrets.CLOUD_MAIL_URL }}
          CLOUD_MAIL_EMAIL: ${{ secrets.CLOUD_MAIL_EMAIL }}
          CLOUD_MAIL_PASSWORD: ${{ secrets.CLOUD_MAIL_PASSWORD }}
          RESIN_URL: ${{ secrets.RESIN_URL }}
          RESIN_ADMIN_TOKEN: ${{ secrets.RESIN_ADMIN_TOKEN }}
          RESIN_SUBSCRIPTION_NAME: ${{ vars.RESIN_SUBSCRIPTION_NAME || 'nodes' }}
          GITHUB_TOKEN: ${{ github.token }}
          NODES_ACCOUNT_BACKUP_KEY: ${{ secrets.NODES_ACCOUNT_BACKUP_KEY }}
          NODES_ACCOUNT_BACKUP_GITHUB: '1'
          RECOVER_ACCOUNTS: ${{ inputs.recover_accounts }}
          RECOVER_EMAIL: ${{ inputs.recover_email }}
        run: |
          if [ "$RECOVER_ACCOUNTS" = true ]; then
            if [ -n "$RECOVER_EMAIL" ]; then
              nodes --resume "$RECOVER_EMAIL" --hide-browser
            else
              nodes --resume-all --hide-browser
            fi
          else
            if [ -n "$RECOVER_EMAIL" ]; then
              echo '::error::recover_email requires recover_accounts=true'; exit 1
            fi
            nodes --count "$NODES_COUNT" --threads 1 --attempts 1 --hide-browser
          fi
      - name: Save encrypted account vault even after task failure
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODES_ACCOUNT_BACKUP_KEY: ${{ secrets.NODES_ACCOUNT_BACKUP_KEY }}
        run: python -m nodes.github_vault save
      - name: Run summary
        if: always()
        env:
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
          CHECK_SERVICES: ${{ github.event_name == 'workflow_dispatch' && inputs.check_services }}
          TASK_OUTCOME: ${{ steps.task.outcome }}
        run: |
          if [ "$CHECK_ONLY" = true ]; then
            echo '本次仅检查原生运行环境，未执行注册或 Resin 同步。' >> "$GITHUB_STEP_SUMMARY"
            if [ "$CHECK_SERVICES" = true ]; then
              echo '另已执行邮箱与 Resin 连通性检查，结果见对应步骤。' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "本次账号任务状态：$TASK_OUTCOME。详情见任务日志。" >> "$GITHUB_STEP_SUMMARY"
            echo '账号密码、会话及邮箱恢复资料经加密保存到 account-vault 分支；备份失败会标记运行失败。节点附件不公开上传。' >> "$GITHUB_STEP_SUMMARY"
          fi
